<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ghibli Lens · Potret Dunia dengan Warna Dongeng</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#31443b;--muted:#6d7d73;--paper:#f7f2e7;--cream:#fffaf0;
  --green:#718c6d;--green2:#536e58;--line:#d9d4c6;--shadow:0 18px 55px rgba(49,68,59,.14)
}
body{
  min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:var(--ink);
  background:radial-gradient(circle at 20% 10%,#fffdf7 0 18%,transparent 42%),
             linear-gradient(135deg,#e9eee1,#f7f0df 52%,#e5eadb);
  display:flex;justify-content:center;padding:18px;
}
.app{width:min(720px,100%);background:rgba(255,252,244,.92);border:1px solid #e1dccd;
  border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
header{padding:28px 24px 18px;text-align:center;background:linear-gradient(#fffdf7,#f7f1e4)}
h1{font-size:clamp(28px,7vw,44px);letter-spacing:-1px}
.tagline{margin-top:7px;color:var(--muted);font-size:16px}
.leaf{font-size:23px;margin-top:7px}
main{padding:20px}
.notice{background:#eef3e9;border:1px solid #d7e1d1;border-radius:18px;padding:14px 16px;
  font-size:14px;line-height:1.5;text-align:center}
.camera{
  margin:18px 0;padding:30px 18px;border:1.5px dashed #aebca9;border-radius:24px;
  background:linear-gradient(145deg,#f9fbf4,#f0eadb);text-align:center
}
.big-btn{
  width:100%;border:0;border-radius:22px;padding:20px 16px;background:var(--green2);
  color:white;font:700 19px Georgia;box-shadow:0 10px 24px rgba(83,110,88,.22);cursor:pointer
}
.big-btn:active{transform:scale(.985)}
.count{height:44px;margin-top:12px;font-size:30px;font-weight:bold;color:var(--green2)}
input[type=file]{display:none}
.section{margin-top:20px}
h2{font-size:21px;margin-bottom:12px}
.controls{display:grid;gap:15px;background:#fffdf7;border:1px solid var(--line);padding:17px;border-radius:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:15px}
label{font-weight:600}
input[type=range]{width:55%;accent-color:var(--green2)}
.value{min-width:48px;text-align:right;color:var(--green2);font-weight:bold}
select{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--ink)}
.check{display:flex;align-items:center;gap:9px}
.check input{width:18px;height:18px;accent-color:var(--green2)}
.preview-wrap{display:none;margin-top:20px;background:#1f2923;border-radius:22px;padding:10px}
canvas{display:block;width:100%;height:auto;border-radius:15px;background:#111}
.ready{display:none;text-align:center;margin:18px 0 10px}
.ready h3{font-size:22px}
.ready p{color:var(--muted);margin-top:5px}
.download{
  display:none;margin-top:12px;width:100%;padding:15px;border:0;border-radius:16px;
  background:#d9a85e;color:#332817;font:700 17px Georgia;cursor:pointer
}
.tip{font-size:13px;color:var(--muted);line-height:1.5;text-align:center;margin-top:12px}
footer{padding:16px 20px 24px;text-align:center;font-size:12px;color:#8a9188}
@media(max-width:480px){body{padding:8px}.app{border-radius:22px}main{padding:14px}.camera{padding:22px 13px}.row{flex-wrap:wrap}.row input[type=range]{width:100%}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="leaf">🌿</div>
  <h1>Ghibli Lens</h1>
  <div class="tagline">Potret dunia dengan warna dongeng ✨</div>
</header>

<main>
  <div class="notice">Semua diproses di perangkatmu. Fotomu tidak dikirim ke mana pun.</div>

  <section class="camera">
    <button class="big-btn" id="shoot">📷 Ambil / Pilih Foto</button>
    <input id="file" type="file" accept="image/*" capture="environment">
    <div class="count" id="count"></div>
  </section>

  <section id="selection" class="section" style="display:none">
    <h2>✨ Pilih suasana</h2>
    <div class="controls">
      <div class="row">
        <label for="intensity">Intensitas</label>
        <input id="intensity" type="range" min="0" max="100" value="80">
        <span class="value" id="intensityVal">80%</span>
      </div>
      <div class="row">
        <label for="style">Gaya kamera</label>
        <select id="style">
          <option value="soft">Soft Dream</option>
          <option value="warm">Warm Storybook</option>
          <option value="lush">Lush Forest</option>
          <option value="vintage">Vintage Film</option>
        </select>
      </div>
      <label class="check"><input id="date" type="checkbox" checked> Cap tanggal</label>
      <button class="big-btn" id="process">🌱 Buat Foto Ghibli</button>
    </div>
  </section>

  <div class="preview-wrap" id="previewWrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="ready" id="ready">
    <h3>Foto siap! 🌿</h3>
    <p>Hasil foto Ghibli Lens</p>
  </div>

  <button class="download" id="download">⬇️ Download PNG</button>
  <div class="tip" id="tip">Kalau unduhan tidak berjalan, tekan lama fotonya lalu pilih Simpan.</div>
</main>
<footer>Ghibli Lens · pemrosesan foto lokal di perangkat</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const file=$('file'), shoot=$('shoot'), count=$('count'), selection=$('selection');
const intensity=$('intensity'), intensityVal=$('intensityVal'), style=$('style');
const date=$('date'), process=$('process'), canvas=$('canvas'), ctx=canvas.getContext('2d');
const previewWrap=$('previewWrap'), ready=$('ready'), download=$('download');
let image=null;

shoot.onclick=()=>file.click();
intensity.oninput=()=>intensityVal.textContent=intensity.value+'%';

file.onchange=e=>{
  const f=e.target.files?.[0]; if(!f)return;
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{
    image=img; selection.style.display='block'; count.textContent='';
    URL.revokeObjectURL(url);
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  };
  img.src=url;
};

function countdown(){
  return new Promise(resolve=>{
    let n=3; count.textContent=n;
    const t=setInterval(()=>{
      n--;
      if(n>0) count.textContent=n;
      else {clearInterval(t);count.textContent='✨';resolve();}
    },700);
  });
}

function drawCover(img,w,h){
  const s=Math.max(w/img.width,h/img.height);
  const nw=img.width*s,nh=img.height*s;
  ctx.drawImage(img,(w-nw)/2,(h-nh)/2,nw,nh);
}

function applyLook(){
  const w=canvas.width,h=canvas.height;
  const amount=Number(intensity.value)/100;
  const type=style.value;

  ctx.save();
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=.08*amount;
  ctx.fillStyle='#fff6d7';
  ctx.fillRect(0,0,w,h);
  ctx.globalAlpha=1;

  // Gentle storybook color wash, kept intentionally subtle.
  const grad=ctx.createLinearGradient(0,0,w,h);
  if(type==='warm'){
    grad.addColorStop(0,'rgba(255,220,160,.16)');
    grad.addColorStop(1,'rgba(110,80,45,.08)');
  }else if(type==='lush'){
    grad.addColorStop(0,'rgba(110,150,105,.12)');
    grad.addColorStop(1,'rgba(45,90,65,.10)');
  }else if(type==='vintage'){
    grad.addColorStop(0,'rgba(255,230,180,.13)');
    grad.addColorStop(1,'rgba(100,75,55,.10)');
  }else{
    grad.addColorStop(0,'rgba(255,245,220,.14)');
    grad.addColorStop(1,'rgba(175,205,170,.08)');
  }
  ctx.globalAlpha=amount;
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
  ctx.restore();

  // Soft vignette.
  const v=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.25,w/2,h/2,Math.max(w,h)*.72);
  v.addColorStop(0,'rgba(255,255,255,0)');
  v.addColorStop(1,`rgba(40,55,45,${.16*amount})`);
  ctx.fillStyle=v;ctx.fillRect(0,0,w,h);

  // Fine paper-like grain generated locally.
  const grain=ctx.createImageData(w,h);
  const d=grain.data;
  const strength=Math.round(13*amount);
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()*2-1)*strength;
    d[i]=128+n;d[i+1]=128+n;d[i+2]=128+n;d[i+3]=Math.abs(n)*.75;
  }
  ctx.save();ctx.globalCompositeOperation='soft-light';ctx.putImageData(grain,0,0);ctx.restore();

  if(date.checked){
    const stamp=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
    ctx.save();
    ctx.font='600 14px Georgia';
    ctx.textAlign='right';
    ctx.fillStyle='rgba(255,250,235,.9)';
    ctx.shadowColor='rgba(30,40,30,.35)';ctx.shadowBlur=4;
    ctx.fillText('Ghibli Lens · '+stamp,w-18,h-18);
    ctx.restore();
  }
}

process.onclick=async()=>{
  if(!image)return;
  process.disabled=true; process.textContent='✨ Mengembangkan cerita...';
  await countdown();
  const max=1600;
  const ratio=image.width/image.height;
  let w=ratio>=1?max:Math.round(max*ratio);
  let h=ratio>=1?Math.round(max/ratio):max;
  canvas.width=w;canvas.height=h;
  drawCover(image,w,h);applyLook();
  previewWrap.style.display='block';ready.style.display='block';download.style.display='block';
  process.disabled=false;process.textContent='🌱 Buat Foto Ghibli';
  setTimeout(()=>previewWrap.scrollIntoView({behavior:'smooth',block:'center'}),100);
};

download.onclick=()=>{
  canvas.toBlob(blob=>{
    const a=document.createElement('a');
    a.download='GhibliLens-'+new Date().toISOString().slice(0,10)+'.png';
    a.href=URL.createObjectURL(blob);a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },'image/png');
};
</script>
</body>
</html>
